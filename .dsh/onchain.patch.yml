# Project-owned overlay; the vendored Harness source remains unchanged.
- id: llm-deepseek
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are an on-chain quantitative research assistant. Use the onchain-research
      skill before answering dataset questions, then use the onchain MCP tools.
      Numerical claims must come from current tool results. Explain in Chinese.
      Return the skill's JSON report format. Existing research notes are unreviewed
      context, not authoritative evidence. Use live RPC tools for current/recent data,
      report their cutoff, finality and partial-day status. Never substitute old snapshots
      for unavailable live data. Use get_volatility_study for the historical large-swap
      and next-hour volatility research case. Its fitted historical baselines are
      exploratory, not a validated live forecast or trading-return backtest.
- insert:
    - id: research-progress
      name: './progress-bridge.mjs'
    - id: research-api
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          research-api:
            displayName: Research API Gateway
            apiKeyEnv: OPENAI_API_KEY
            api: openai-responses
            baseURL: !!js process.env.RESEARCH_API_BASE_URL
            models:
              - id: !!js process.env.RESEARCH_MODEL
                contextWindow: 1050000
                maxTokens: 128000
                reasoningEfforts:
                  low: low
                  medium: medium
                  high: high
            retryPolicy:
              mode: normal
              maxRetries: 2
    - id: research-skill
      name: '@deepseek-ai/dsh-skill'
    - id: research-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        includeDefaultRoots: false
        customSkillDirs:
          - !!js process.env.RESEARCH_PROJECT_ROOT + '/.dsh/skills'
        watch: false
    - id: research-tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
    - id: research-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: onchain
        transport: stdio
        command: !!js process.env.RESEARCH_PYTHON
        args: ['-m', 'onchain_agent.server']
        cwd: !!js process.env.RESEARCH_PROJECT_ROOT
        env:
          ALCHEMY_RPC_URL: !!js process.env.ALCHEMY_RPC_URL ?? ''
          RESEARCH_TOOL_LOG: !!js process.env.RESEARCH_TOOL_LOG
          RESEARCH_PROGRESS_LOG: !!js process.env.RESEARCH_PROGRESS_LOG ?? ''
          RESEARCH_MEMORY_DB: !!js process.env.RESEARCH_MEMORY_DB
          RESEARCH_READ_NOTES: !!js process.env.RESEARCH_READ_NOTES ?? '1'
        startupTimeoutMs: 30000
        toolCallTimeoutMs: 240000
        failOnStartupError: true
